[package]
name = "riplog"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Embed the IANA tzdb in the binary so named timezones (`Europe/Paris`, …)
# work on hosts that don't ship `/usr/share/zoneinfo` (e.g. scratch/alpine
# containers). Adds ~600 KiB; enable for static release builds.
bundled-tzdb = ["jiff/tzdb-bundle-always"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "env", "wrap_help"] }
ctrlc = "3"
env_logger = "0.11.10"
fastrand = "2"
humanize-bytes = "1.0.6"
jiff = "0.2"
log = "0.4.29"
memchr = "2"
rapidhash = "4"
regex = "1"
smallvec = "1"
smartstring = "1.0.1"
vecmap-rs = "0.2.4"

[dev-dependencies]
libc = "0.2"
proptest = "1"
logfmt = "0.0.2"
