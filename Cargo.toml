[package]
name = "riplog"
version = "0.1.0"
edition = "2021"
publish = false
description = "Slice and filter logfmt streams: bisect by timestamp and apply boolean filters per line."
license = "MIT OR Apache-2.0"
authors = ["Simon Cruanes <simon.cruanes@ahrefs.com>"]
readme = "README.md"
repository = "https://github.com/c-cube/riplog"

[package.metadata.deb]
section = "utils"
priority = "optional"
assets = [
    ["target/release/riplog", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/riplog/README.md", "644"],
]
extended-description = """\
riplog reads one or more logfmt files (or stdin), bisects on timestamp
when given a time window, and applies boolean filters per line. Useful
for slicing large rotated log files by time range and key/value queries
without having to grep + awk by hand."""

[features]
default = []
# Embed the IANA tzdb in the binary so named timezones (`Europe/Paris`, …)
# work on hosts that don't ship `/usr/share/zoneinfo` (e.g. scratch/alpine
# containers). Adds ~600 KiB; enable for static release builds.
bundled-tzdb = ["jiff/tzdb-bundle-always"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "env", "wrap_help"] }
ctrlc = "3"
env_logger = "0.11.10"
fastrand = "2"
humanize-bytes = "1.0.6"
jiff = "0.2"
log = "0.4.29"
memchr = "2"
rapidhash = "4"
regex = "1"
serde_json = "1"
smallvec = "1"
smartstring = "1.0.1"
vecmap-rs = "0.2.4"

[dev-dependencies]
libc = "0.2"
proptest = "1"
logfmt = "0.0.2"
serde_json = "1"
