[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riplog-tui"
version = "0.1.0"
description = "Live Textual dashboard for riplog aggregate (logfmt) streams"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.86.2",
]

[project.scripts]
riplog-tui = "riplog_tui:main"

[tool.setuptools]
py-modules = ["riplog_tui"]
